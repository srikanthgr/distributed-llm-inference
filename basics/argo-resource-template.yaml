apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: deploy-vllm-service-
spec:
  serviceAccountName: argo
  entrypoint: deploy
  templates:
  - name: deploy
    resource:
      action: create
      manifest: |
        apiVersion: v1
        kind: Service
        metadata:
          name: vllm-example-service
        spec:
          selector:
            app: vllm-example
          ports:
          - protocol: TCP
            port: 8000
            targetPort: 8000

